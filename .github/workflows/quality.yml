name: quality

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint-test-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Test with coverage
        run: uv run --no-sync pytest --cov=omnitensor --cov-report=term --cov-fail-under=80
      # The root run collects `tests/` and never descends into `providers/`, so
      # each provider distribution's suite ran only if something ran it
      # deliberately. Nothing did: media-transcription sat at 35 failures of
      # 107 that no gate reported.
      - name: Install provider distributions
        run: |
          for provider in providers/*/; do
            uv pip install --no-deps -e "$provider"
            uv pip install -r <(uv run --no-sync python scripts/provider-requirements.py "$provider")
          done
      - name: Test provider suites
        run: OMNI_PYTHON="$(uv run --no-sync python -c 'import sys; print(sys.executable)')" ./scripts/run-provider-suites.sh
