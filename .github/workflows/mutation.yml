name: mutation

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  selector-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.manifest.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked selector environment
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev
      - id: manifest
        name: Validate exact selector manifest
        run: |
          shards="$(PYTHONPATH=src uv run --no-sync python -m omnitensor.mutation_campaign \
            mutation-selectors.json --list-shards)"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  exact-shards:
    needs: selector-plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.selector-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked mutation environment
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev
      - name: Run and gate exact shard
        run: |
          uv run --no-sync python -m omnitensor.mutation_campaign mutation-selectors.json \
            --shard "${{ matrix.shard }}" \
            --report "$RUNNER_TEMP/mutmut-${{ matrix.shard }}.txt"
      - name: Archive shard report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutmut-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutmut-${{ matrix.shard }}.txt
          if-no-files-found: error
