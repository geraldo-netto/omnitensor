name: external-plugin

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  clean-wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked build environment
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev
      - name: Build OmniTensor and external template wheels
        run: |
          uv run --no-sync python -m build --wheel --no-isolation --outdir dist .
          uv run --no-sync python -m build --wheel --no-isolation --outdir examples/omnitensor-plugin-template/dist examples/omnitensor-plugin-template
      - name: Install into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/omnitensor-external"
          "$RUNNER_TEMP/omnitensor-external/bin/python" -m pip install \
            dist/omnitensor-*.whl \
            examples/omnitensor-plugin-template/dist/omnitensor_plugin_template-*.whl
      - name: Execute one installed plugin job outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/omnitensor-external/bin/omnitensor-plugin-smoke" \
            --plugin-id template-workload \
            --payload '{"values":[-1,0,1]}' \
            --configuration '{"scale":2}'
