name: external-plugin

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  clean-wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked build environment
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev
      # Build, install and execute live in the script, so the one gate that
      # proves an installed plugin works without the source tree is the same
      # command a developer can run. It used to exist only here.
      - name: Build, install and execute one plugin outside the checkout
        run: OMNI_PYTHON="$(uv run --no-sync python -c 'import sys; print(sys.executable)')" ./scripts/run-external-plugin-smoke.sh
