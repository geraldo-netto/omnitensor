[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor"
version = "0.1.0"
description = "Unified local inference service for GPU, NPU, and TPU accelerators, publishing the runtime contract consumed by the cinnamon-xpuwlm applet."
readme = "README.md"
requires-python = ">=3.11"
# Plugin workers are confined with a seccomp filter built from a per-ABI
# syscall table, and tables exist only for these two. On any other machine a
# worker refuses to start rather than run plugin code unconfined, so the
# supported set is a property of the package and not just of the source.
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Gnome",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Geraldo Netto", email = "geraldonetto@gmail.com"}]
dependencies = [
    "chardet>=5.2,<6",
    "cryptography>=42.0",
    "jsonschema>=4.21",
    "msgpack>=1.0",
]

[project.optional-dependencies]
tpu = ["tflite-runtime>=2.14"]
# numpy is named explicitly rather than relied on as an ncnn transitive: the
# Vulkan executor imports it directly, so a future ncnn wheel that dropped it
# would break inference with an ImportError instead of a clear resolver error.
gpu = ["ncnn>=1.0.20240102", "numpy>=1.24", "pillow>=10.0"]
# NOT plain onnxruntime: that wheel ships CPUExecutionProvider only, which
# executors/gpu.py deliberately refuses, so it can never satisfy the GPU lane.
# Pick the extra matching the vendor's runtime.
gpu-onnx-cuda = ["onnxruntime-gpu>=1.17"]
gpu-onnx-rocm = ["onnxruntime-rocm>=1.17"]
npu = ["openvino>=2024.0"]
# Packaging-time only: converts ONNX/TorchScript into the ncnn form the GPU
# lane executes. Never installed into the service environment — converting on
# demand would install unverified weights while answering a request.
convert = ["pnnx>=20240101"]
# Packaging-time only: converts ONNX into OpenVINO IR for the NPU lane. Kept
# separate from [npu], which is the runtime installed with the service.
convert-npu = ["openvino>=2024.0"]
# Optional document/image parsing inside the isolated event workload. PyMuPDF
# can use its Tesseract integration for OCR; neither package is imported by the
# long-running service process.
events = ["pymupdf>=1.24"]
dev = [
    "build>=1.2",
    "hatchling>=1.25",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "hypothesis>=6.100",
    "mutmut==3.7.0",
    "onnx>=1.16",
]

[project.scripts]
omnitensor = "omnitensor.service:main"
omnitensor-plugin-smoke = "omnitensor.sdk.smoke:main"
omnitensor-verify-install = "omnitensor.acceptance:main"
omnitensor-prepare-artifact = "omnitensor.preparation:main"
omnitensor-convert-model = "omnitensor.conversion:main"
omnitensor-qualify-document-questions = "omnitensor.plugins.document_acceptance:main"
omnitensor-qualify-selected-text = "omnitensor.plugins.selected_text_acceptance:main"
omnitensor-install-qwen-artifacts = "omnitensor.qwen_installation:main"
omnitensor-install-hebrew-translation-model = "omnitensor.hebrew_installation:main"
omnitensor-install-media-artifacts = "omnitensor.media_installation:main"
omnitensor-configure-low-light = "omnitensor.lowlight:configure_main"
omnitensor-setup-publisher-key = "omnitensor.publisher_identity:setup_main"
omnitensor-check-mutation-coverage = "omnitensor.mutation_quality:main"
omnitensor-mutmut = "omnitensor.mutation_engine:main"
omnitensor-grant = "omnitensor.consent:main"
omnitensor-import-events = "omnitensor.event_cli:main"

# The producer half is a second distribution in this repository, so one lock
# describes both and a producer environment is reproducible from it:
#   uv sync --package omnitensor-training --extra document-producers
[tool.uv.workspace]
members = ["packaging/omnitensor-training"]

[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor"]
# `omnitensor.training` is a separate distribution built from
# `packaging/omnitensor-training`. It installs into this same package
# directory; it is excluded here so the service wheel does not also carry it.
exclude = ["src/omnitensor/training"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "omnitensor/schemas"
"workloads" = "omnitensor/workloads"
"generation-models" = "omnitensor/generation-models"
"evaluation-corpora" = "omnitensor/evaluation-corpora"
"plugin-manifests" = "omnitensor/plugin-manifests"
"acceptance-evidence" = "omnitensor/acceptance-evidence"

[tool.mutmut]
source_paths = ["src/omnitensor/"]
only_mutate = [
    "src/omnitensor/contract.py",
    "src/omnitensor/executors/base.py",
    "src/omnitensor/executors/gpu.py",
    "src/omnitensor/forecastresult.py",
    "src/omnitensor/mutation_engine.py",
    "src/omnitensor/outputcontract.py",
    "src/omnitensor/plugins/acceptance_kit.py",
    "src/omnitensor/plugins/document_acceptance.py",
    "src/omnitensor/plugins/document_qa.py",
    "src/omnitensor/plugins/event_calendar.py",
    "src/omnitensor/plugins/event_confirmation.py",
    "src/omnitensor/plugins/event_passes.py",
    "src/omnitensor/plugins/event_workload.py",
    "src/omnitensor/plugins/fragments.py",
    "src/omnitensor/scheduler.py",
    "src/omnitensor/snapshot.py",
    "src/omnitensor/tensorcontract.py",
    # Still mutated: the campaign reads this source tree, which holds both
    # distributions. Only the wheel boundary moved.
    "src/omnitensor/training/binding.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = [
    "schemas/",
    "scripts/",
    "systemd/",
    "workloads/",
    ".github/workflows/",
    "docs/",
    "examples/omnitensor-plugin-template/",
    "helpers/bpf/",
    "model-recipes/",
    "generation-models/",
    "evaluation-corpora/",
    "plugin-manifests/",
    "providers/",
    "acceptance-evidence/",
    "README.md",
    "mutation-selectors.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/omnitensor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001, PLC0415 and PLW0603 are selected because the source already answers
# them 89 times in `# noqa` comments: those comments were written to say that a
# broad except, a deferred import or a module-level memo is deliberate here,
# and until the rules were selected they said it to nobody. RUF100 keeps them
# honest by failing on a suppression that no longer suppresses anything.
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C90",
    "BLE001",
    "PLC0415",
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
# A test that imports inside the case it is about keeps the case readable and
# can monkeypatch before the import happens; PLC0415 is about the production
# import graph, which is where it is enforced.
"tests/**" = ["PLC0415"]
"providers/*/tests/**" = ["PLC0415"]
"scripts/**" = ["PLC0415"]

[tool.ruff.lint.mccabe]
max-complexity = 8
