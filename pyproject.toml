[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor"
version = "0.1.0"
description = "Unified local inference service for TPU, NPU, and GPU accelerators, publishing the runtime contract consumed by the cinnamon-tpuwlm applet."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Geraldo Netto", email = "geraldonetto@gmail.com"}]
dependencies = [
    "cryptography>=42.0",
    "jsonschema>=4.21",
    "dbus-fast>=2.21",
]

[project.optional-dependencies]
tpu = ["tflite-runtime>=2.14"]
# numpy is named explicitly rather than relied on as an ncnn transitive: the
# Vulkan executor imports it directly, so a future ncnn wheel that dropped it
# would break inference with an ImportError instead of a clear resolver error.
gpu = ["ncnn>=1.0.20240102", "numpy>=1.24"]
# NOT plain onnxruntime: that wheel ships CPUExecutionProvider only, which
# executors/gpu.py deliberately refuses, so it can never satisfy the GPU lane.
# Pick the extra matching the vendor's runtime.
gpu-onnx-cuda = ["onnxruntime-gpu>=1.17"]
gpu-onnx-rocm = ["onnxruntime-rocm>=1.17"]
npu = ["openvino>=2024.0"]
# Packaging-time only: converts ONNX/TorchScript into the ncnn form the GPU
# lane executes. Never installed into the service environment — converting on
# demand would install unverified weights while answering a request.
convert = ["pnnx>=20240101"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "hypothesis>=6.100",
    "mutmut>=3.2",
]

[project.scripts]
omnitensor = "omnitensor.service:main"
omnitensor-plugin-smoke = "omnitensor.sdk.smoke:main"
omnitensor-verify-install = "omnitensor.acceptance:main"
omnitensor-prepare-artifact = "omnitensor.preparation:main"
omnitensor-convert-model = "omnitensor.conversion:main"
omnitensor-grant = "omnitensor.consent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "omnitensor/schemas"
"workloads" = "omnitensor/workloads"

[tool.mutmut]
source_paths = ["src/omnitensor/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = [
    "schemas/",
    "systemd/",
    "workloads/",
    ".github/workflows/",
    "docs/",
    "examples/omnitensor-plugin-template/",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/omnitensor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8
