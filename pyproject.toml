[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor"
version = "0.1.0"
description = "Unified local inference service for TPU, NPU, and GPU accelerators, publishing the runtime contract consumed by the cinnamon-tpuwlm applet."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Geraldo Netto", email = "geraldonetto@gmail.com"}]
dependencies = [
    "cryptography>=42.0",
    "jsonschema>=4.21",
    "dbus-fast>=2.21",
]

[project.optional-dependencies]
tpu = ["tflite-runtime>=2.14"]
gpu = ["ncnn>=1.0.20240102"]
gpu-onnx = ["onnxruntime>=1.17"]
npu = ["openvino>=2024.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "hypothesis>=6.100",
    "mutmut>=3.2",
]

[project.scripts]
omnitensor = "omnitensor.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "omnitensor/schemas"
"workloads" = "omnitensor/workloads"

[tool.mutmut]
source_paths = ["src/omnitensor/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = [
    "schemas/",
    "systemd/",
    "workloads/",
    "docs/",
    "examples/omnitensor-plugin-template/",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/omnitensor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8
