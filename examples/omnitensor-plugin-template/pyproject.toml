[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor-plugin-template"
version = "0.1.0"
description = "Minimal separately packaged OmniTensor workload plugin"
requires-python = ">=3.11"
dependencies = ["omnitensor>=0.1,<1"]

[project.optional-dependencies]
test = ["mutmut>=3.2,<4", "pytest>=8", "pytest-cov>=5"]

[project.entry-points."omnitensor.workloads"]
template-workload = "omnitensor_template.plugin:TemplatePlugin"

# The manifest ships inside the package directory, not at the wheel root:
# two plugins built from this template would otherwise install to the same
# top-level omnitensor-plugin.json and clobber each other.  Discovery matches
# the file by name anywhere in the distribution, so nesting it is enough.
[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor_template"]

[tool.mutmut]
source_paths = ["src/omnitensor_template/"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
