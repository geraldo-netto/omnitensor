[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor-qwen-document-translation"
version = "0.2.0"
description = "Pinned Qwen/DictaLM Vulkan provider for OmniTensor document translation"
requires-python = ">=3.11"
license = "MIT"
# The `media` extra carries PyMuPDF: this workload translates the documents a
# person selected, and a selection that may contain a PDF needs the adapter
# that reads one.
dependencies = ["omnitensor-vulkan-runtime[media]==0.2.0"]

[project.entry-points."omnitensor.workloads"]
document-translation = "omnitensor_document_translation:create"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor_document_translation"]

[tool.hatch.build.targets.wheel.force-include]
"../../plugin-manifests/document-translation.json" = "omnitensor_document_translation/omnitensor-plugin.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
