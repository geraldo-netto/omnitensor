[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor-qwen-document-translation"
version = "0.2.0"
description = "Pinned Qwen/DictaLM Vulkan provider for OmniTensor document translation"
requires-python = ">=3.11"
license = "MIT"
# The `media` extra carries PyMuPDF: this workload translates the documents a
# person selected, and a selection that may contain a PDF needs the adapter
# that reads one.
dependencies = ["omnitensor-vulkan-runtime[media]==0.2.0"]

[project.entry-points."omnitensor.workloads"]
document-translation = "omnitensor_document_translation:create"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor_document_translation"]

[tool.hatch.build.targets.wheel.force-include]
"../../plugin-manifests/document-translation.json" = "omnitensor_document_translation/omnitensor-plugin.json"

# The floor this distribution's own suite must hold. A shim is one import and one
# `__all__`; anything less than every line means the installed binding is unproven.
[tool.coverage.report]
fail_under = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# So the identity suite's one real check — that the installed shim object *is*
# the runtime factory — runs instead of skipping. It used to skip on every
# machine that had not installed both wheels, which is every machine that had
# not read the skip reason, and a coverage floor over a shim that never loads
# is a floor over nothing.
pythonpath = ["src", "../vulkan-runtime/src", "../../src"]
