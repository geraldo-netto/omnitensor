[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor-qwen-ask-selected-files"
version = "0.2.0"
description = "Pinned BGE and Qwen/Vulkan provider for OmniTensor document questions"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "omnitensor-vulkan-runtime==0.2.0",
  "omnitensor-ncnn-embeddings==0.2.0",
  # Verbatim OCR extraction for selected images and scans (OMNI-0615); the
  # ncnn runtime it needs already arrives with the embedder above.
  "vulkanocr>=0.1,<1",
]

[project.entry-points."omnitensor.workloads"]
ask-selected-files = "omnitensor_ask_selected_files:create"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor_ask_selected_files"]

[tool.hatch.build.targets.wheel.force-include]
"../../plugin-manifests/ask-selected-files.json" = "omnitensor_ask_selected_files/omnitensor-plugin.json"

# The floor this distribution's own suite must hold. This one is no longer a
# shim — it assembles a workload out of two distributions — and every line of
# that assembly is what its suite exercises.
[tool.coverage.report]
fail_under = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# So the suite builds the real workload against its sibling distributions
# rather than skipping on every machine that has not installed both wheels.
pythonpath = ["src", "..", "../vulkan-runtime/src", "../ncnn-embeddings/src", "../../src"]
