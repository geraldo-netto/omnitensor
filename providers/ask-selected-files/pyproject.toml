[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor-qwen-ask-selected-files"
version = "0.2.0"
description = "Pinned BGE and Qwen/Vulkan provider for OmniTensor document questions"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["omnitensor-vulkan-runtime[documents]==0.2.0"]

[project.entry-points."omnitensor.workloads"]
ask-selected-files = "omnitensor_ask_selected_files:create"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor_ask_selected_files"]

[tool.hatch.build.targets.wheel.force-include]
"../../plugin-manifests/ask-selected-files.json" = "omnitensor_ask_selected_files/omnitensor-plugin.json"

# The floor this distribution's own suite must hold. A shim is one import and one
# `__all__`; anything less than every line means the installed binding is unproven.
[tool.coverage.report]
fail_under = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# So the identity suite's one real check — that the installed shim object *is*
# the runtime factory — runs instead of skipping. It used to skip on every
# machine that had not installed both wheels, which is every machine that had
# not read the skip reason, and a coverage floor over a shim that never loads
# is a floor over nothing.
pythonpath = ["src", "..", "../vulkan-runtime/src", "../../src"]
