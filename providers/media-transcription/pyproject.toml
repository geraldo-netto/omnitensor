[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor-media-transcription"
version = "0.2.0"
description = "Pinned Vulkan-only media transcription provider for OmniTensor"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "av>=14,<17",
  "CairoSVG>=2.7,<3",
  "defusedxml>=0.7.1,<1",
  "omnitensor>=0.1,<1",
  "omnitensor-vulkan-runtime==0.2.0",
  "Pillow>=11,<13",
  "PyMuPDF>=1.24,<2",
  # The fallback reader, and pure Python: PyMuPDF ships a compiled wheel that
  # does not load on every machine, and a person whose PDF is refused for that
  # cannot tell it from a broken file. pypdf extracts text without rendering,
  # which is a smaller answer rather than no answer.
  "pypdf>=4.3,<7",
  "pywhispercpp==1.5.0",
]

[project.entry-points."omnitensor.workloads"]
media-transcription = "omnitensor_media_transcription:create"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor_media_transcription"]

[tool.hatch.build.targets.wheel.force-include]
"../../plugin-manifests/media-transcription.json" = "omnitensor_media_transcription/omnitensor-plugin.json"
"../../acceptance-evidence/media-transcription-rx6600xt-report.json" = "omnitensor_media_transcription/media-transcription-rx6600xt-report.json"

# The floor this distribution's own suite must hold; measured 98% when set.
[tool.coverage.report]
fail_under = 95

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../src", "../vulkan-runtime/src"]
asyncio_mode = "auto"

[tool.mutmut]
source_paths = ["src/omnitensor_media_transcription/"]
pytest_add_cli_args_test_selection = ["tests/"]
