[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor-vulkan-runtime"
version = "0.2.0"
description = "GPU-only Qwen and BGE runtime wiring for OmniTensor workloads"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "omnitensor>=0.1,<1",
  "llama-cpp-python==0.3.34",
]

[project.optional-dependencies]
media = ["pymupdf>=1.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor_vulkan_runtime"]

[tool.mutmut]
source_paths = ["src/omnitensor_vulkan_runtime/"]
pytest_add_cli_args_test_selection = ["tests/"]

# The floor this distribution's own suite must hold. The root `--cov-fail-under`
# measures `src/omnitensor` only, so without this a provider module no test loads
# is indistinguishable from one at 100%. Measured 97% when the floor was set.
[tool.coverage.report]
fail_under = 95

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../src"]
asyncio_mode = "auto"
