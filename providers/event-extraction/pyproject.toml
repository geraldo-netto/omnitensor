[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor-qwen-event-extraction"
version = "0.2.0"
description = "Pinned Qwen/Vulkan provider for OmniTensor event extraction"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["omnitensor-vulkan-runtime==0.2.0"]

[project.entry-points."omnitensor.workloads"]
event-extraction = "omnitensor_event_extraction:create"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor_event_extraction"]

[tool.hatch.build.targets.wheel.force-include]
"../../plugin-manifests/event-extraction.json" = "omnitensor_event_extraction/omnitensor-plugin.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
