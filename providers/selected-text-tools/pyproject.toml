[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitensor-qwen-selected-text-tools"
version = "0.2.0"
description = "Pinned Qwen/Vulkan provider for OmniTensor selected-text tools"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["omnitensor-qwen-vulkan-runtime==0.2.0"]

[project.entry-points."omnitensor.workloads"]
selected-text-tools = "omnitensor_qwen_selected_text:create"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitensor_qwen_selected_text"]

[tool.hatch.build.targets.wheel.force-include]
"../../plugin-manifests/selected-text-tools.json" = "omnitensor_qwen_selected_text/omnitensor-plugin.json"
